[pytest]
# pytest configuration for Echo Gateway

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
# 거버넌스 코어 테스트(루트 test_*.py, q_quantum)도 수집. 이전엔 tests/만 수집되어
# test_bcdsi.py 등 57개가 기본 실행/CI에서 한 번도 돌지 않았음.
testpaths =
    tests
    test_bcdsi.py
    test_e_break_engine.py
    test_ebreak_calculator.py
    q_quantum/quantum

# 저장소 루트를 import 경로에 추가. tests/에 __init__.py/conftest.py가 없어서
# `pytest`(CI 방식)로 실행하면 echo_gateway/bcdsi import가 ModuleNotFoundError.
# `python -m pytest`는 cwd를 경로에 넣어줘서 로컬에선 가려져 있었음.
pythonpath = .

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    integration: Integration tests (auth, sandbox, bcdsi)
    e2e: End-to-end tests (requires running server)
    slow: Slow tests (> 1s)

# Asyncio mode
asyncio_mode = auto
