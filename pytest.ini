[pytest]
# pytest configuration for Echo Gateway

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    integration: Integration tests (auth, sandbox, bcdsi)
    e2e: End-to-end tests (requires running server)
    slow: Slow tests (> 1s)

# Asyncio mode
asyncio_mode = auto
